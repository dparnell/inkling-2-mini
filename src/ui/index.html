<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkling Chat</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e3de;
  --accent: #3b5bdb; --accent-ink: #ffffff; --think: #f1f0ea; --code: #f3f3f0; --user: #e8edfb; --danger: #c92a2a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1c1c1a; --ink: #ecebe6; --muted: #9a9993; --line: #2e2e2b;
    --accent: #7b93f0; --accent-ink: #10131c; --think: #22221f; --code: #23231f; --user: #232a40; --danger: #ff8787;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1c1c1a; --ink: #ecebe6; --muted: #9a9993; --line: #2e2e2b;
  --accent: #7b93f0; --accent-ink: #10131c; --think: #22221f; --code: #23231f; --user: #232a40; --danger: #ff8787;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
#side { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#side header { padding: 14px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
#side header b { font-size: 16px; flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
#convs { flex: 1; overflow: auto; padding: 8px; }
.conv { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.conv span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv:hover, .conv.on { background: var(--think); }
.conv .x { opacity: 0; border: 0; background: none; color: var(--muted); }
.conv:hover .x { opacity: 1; }
#side footer { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
#side footer a { color: var(--accent); text-decoration: none; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
#top .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#top select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--panel); }
#menu { display: none; }
#log { flex: 1; overflow: auto; padding: 24px 16px 40px; }
.wrap { max-width: 820px; margin: 0 auto; }
.msg { margin: 0 0 22px; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 10px; align-items: center; }
.msg.user .body { background: var(--user); padding: 10px 14px; border-radius: 12px; display: inline-block; max-width: 100%; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { text-align: right; }
.msg.user .who { justify-content: flex-end; }
.msg.user .imgs { justify-content: flex-end; }
.body p { margin: 0 0 10px; }
.body p:last-child { margin-bottom: 0; }
.body pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; font-size: 13px; position: relative; }
.body code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.92em; background: var(--code); padding: 1px 4px; border-radius: 4px; }
.body pre code { background: none; padding: 0; }
.body h1, .body h2, .body h3 { margin: 14px 0 8px; line-height: 1.25; }
.body ul, .body ol { margin: 0 0 10px; padding-left: 24px; }
.body table { border-collapse: collapse; margin: 0 0 10px; }
.body td, .body th { border: 1px solid var(--line); padding: 4px 8px; }
.body blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
details.think { background: var(--think); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
details.think summary { cursor: pointer; user-select: none; }
details.think .tbody { white-space: pre-wrap; margin-top: 6px; max-height: 360px; overflow: auto; }
.tool { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--code); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; white-space: pre-wrap; }
.stats { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.stats button { border: 0; background: none; color: var(--muted); padding: 0; }
.stats button:hover { color: var(--ink); }
.imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.imgs img { max-height: 140px; max-width: 220px; border-radius: 8px; border: 1px solid var(--line); }
.err { color: var(--danger); }
.cursor::after { content: "\25AE"; animation: blink 1s steps(1) infinite; margin-left: 2px; color: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }
#composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
#composer .wrap { display: flex; flex-direction: column; gap: 8px; }
#pending { display: flex; gap: 6px; flex-wrap: wrap; }
#pending .p { position: relative; }
#pending img { height: 64px; border-radius: 6px; border: 1px solid var(--line); }
#pending .p button { position: absolute; top: -6px; right: -6px; border-radius: 50%; width: 20px; height: 20px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; line-height: 16px; padding: 0; }
.row { display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; resize: none; min-height: 44px; max-height: 240px; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: var(--bg); outline: none; }
#input:focus { border-color: var(--accent); }
#send { min-width: 76px; height: 44px; border-radius: 12px; }
#attach { height: 44px; width: 44px; border-radius: 12px; font-size: 20px; }
.hint { font-size: 12px; color: var(--muted); }
#settings { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100%; background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow: auto; transform: translateX(100%); transition: transform 0.18s; z-index: 10; }
#settings.open { transform: none; }
#settings label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
#settings input[type=number], #settings textarea, #settings select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); }
#settings textarea { min-height: 90px; resize: vertical; }
#settings h3 { margin: 0; display: flex; justify-content: space-between; align-items: center; }
#settings input[type=password] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 18px; width: min(380px, 92vw); }
dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
dialog h3 { margin: 0 0 6px; }
dialog input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); margin: 10px 0 14px; }
.dlgbtns { display: flex; justify-content: flex-end; gap: 8px; }
#drop { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 22px; z-index: 20; pointer-events: none; }
.empty { text-align: center; color: var(--muted); margin-top: 18vh; }
.empty h2 { color: var(--ink); font-weight: 600; margin-bottom: 6px; }
@media (max-width: 760px) {
  #side { position: fixed; inset: 0 auto 0 0; z-index: 15; transform: translateX(-100%); transition: transform 0.18s; }
  #side.open { transform: none; }
  #menu { display: inline-block; }
}
</style>
</head>
<body>
<aside id="side">
  <header><b>Inkling</b><button class="btn" id="new" title="New chat">+ New</button></header>
  <div id="convs"></div>
  <footer>
    <div id="modelinfo">connecting…</div>
    <a href="/dashboard" target="_blank">Performance dashboard ↗</a>
  </footer>
</aside>
<main id="main">
  <div id="top">
    <button class="btn" id="menu">☰</button>
    <div class="title" id="title">New chat</div>
    <select id="effort" title="Reasoning effort">
      <option value="none">Thinking: off</option>
      <option value="minimal">Thinking: minimal</option>
      <option value="low">Thinking: low</option>
      <option value="medium">Thinking: medium</option>
      <option value="high" selected>Thinking: high</option>
      <option value="xhigh">Thinking: max</option>
    </select>
    <button class="btn" id="gear" title="Settings">⚙</button>
  </div>
  <div id="log"><div class="wrap" id="msgs"></div></div>
  <div id="composer">
    <div class="wrap">
      <div id="pending"></div>
      <div class="row">
        <button class="btn" id="attach" title="Attach images">+</button>
        <textarea id="input" rows="1" placeholder="Message Inkling (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="btn primary" id="send">Send</button>
      </div>
      <div class="hint" id="hint">Paste or drop images to attach them.</div>
    </div>
  </div>
</main>
<div id="settings">
  <h3>Settings <button class="btn" id="close">✕</button></h3>
  <label for="sys">System prompt</label>
  <textarea id="sys" placeholder="Optional instructions for the assistant"></textarea>
  <label for="temp">Temperature</label><input id="temp" type="number" step="0.05" min="0" max="2" value="1">
  <label for="topp">Top p</label><input id="topp" type="number" step="0.01" min="0" max="1" value="1">
  <label for="maxtok">Max tokens</label><input id="maxtok" type="number" step="64" min="1" value="8192">
  <label for="showthink">Reasoning display</label>
  <select id="showthink"><option value="collapsed">Collapsed</option><option value="open">Expanded</option><option value="hide">Hidden</option></select>
  <label for="tools">Tools (OpenAI JSON array, optional)</label>
  <textarea id="tools" placeholder='[{"type":"function","function":{"name":"get_weather","parameters":{"type":"object","properties":{"city":{"type":"string"}}}}}]'></textarea>
  <label for="theme">Theme</label>
  <select id="theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <label for="apikey">API key (servers started with --api-key)</label>
  <input id="apikey" type="password" autocomplete="off" placeholder="not set">
  <p class="hint">Settings and the API key are stored in this browser.</p>
</div>
<dialog id="keydlg">
  <form method="dialog">
    <h3>API key required</h3>
    <p class="hint" id="keymsg">This server requires an API key (it was started with <code>--api-key</code>).</p>
    <input id="keyinput" type="password" autocomplete="off" placeholder="API key" required>
    <div class="dlgbtns"><button class="btn" type="button" id="keycancel">Cancel</button><button class="btn primary" value="ok">Save</button></div>
  </form>
</dialog>
<input type="file" id="file" accept="image/*" multiple hidden>
<div id="drop">Drop images to attach</div>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("inkling." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("inkling." + k, JSON.stringify(v)); } catch {} },
};
let model = "inkling-2-mini", vision = false;
let convs = store.get("convs", []);
let cur = null, pending = [], busy = null;

// ---------- settings
const fields = ["sys", "temp", "topp", "maxtok", "showthink", "tools", "theme", "effort"];
const saved = store.get("settings", {});
for (const f of fields) if (saved[f] != null) $(f).value = saved[f];
function saveSettings() { const s = {}; for (const f of fields) s[f] = $(f).value; store.set("settings", s); applyTheme(); }
for (const f of fields) $(f).addEventListener("change", saveSettings);
function applyTheme() { const t = $("theme").value; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme();
$("gear").onclick = () => $("settings").classList.toggle("open");
$("close").onclick = () => $("settings").classList.remove("open");
$("menu").onclick = () => $("side").classList.toggle("open");

// ---------- API key: sent as a bearer token; asked for when the server answers 401
const KEY = "inkling.apikey";
const getKey = () => { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } };
const setKey = (k) => { try { k ? localStorage.setItem(KEY, k) : localStorage.removeItem(KEY); } catch {} $("apikey").value = k; };
$("apikey").value = getKey();
$("apikey").addEventListener("change", () => { setKey($("apikey").value.trim()); loadModels(); });
let keyAsk = null;
function askKey(rejected) {
  if (keyAsk) return keyAsk; // one dialog for concurrent requests
  const dlg = $("keydlg");
  $("keymsg").textContent = rejected ? "The saved API key was rejected. Enter the key this server was started with." : "This server requires an API key (it was started with --api-key).";
  $("keyinput").value = "";
  keyAsk = new Promise((resolve) => { keyDone = resolve; dlg.showModal(); $("keyinput").focus(); });
  return keyAsk;
}
// Settle from the synchronous events (submit / Cancel / Escape): the dialog "close" event is
// queued behind a rendering update and may not arrive while the page is in the background.
let keyDone = null;
function finishKey(ok) {
  const dlg = $("keydlg");
  const k = $("keyinput").value.trim();
  if (dlg.open) dlg.close();
  const done = keyDone; keyDone = null; keyAsk = null;
  if (ok && k) setKey(k);
  if (done) done(!!(ok && k));
}
$("keydlg").querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); finishKey(true); });
$("keydlg").addEventListener("cancel", (e) => { e.preventDefault(); finishKey(false); });
$("keycancel").onclick = () => finishKey(false);
async function apiFetch(url, opts = {}) {
  for (;;) {
    const key = getKey();
    const headers = { ...(opts.headers || {}) };
    if (key) headers.authorization = "Bearer " + key;
    const r = await fetch(url, { ...opts, headers });
    if (r.status !== 401 || !(await askKey(!!key))) return r;
  }
}

// ---------- model info
async function loadModels() {
  try {
    const r = await apiFetch("/v1/models");
    if (r.status === 401) { $("modelinfo").textContent = "API key required (set it in ⚙ settings)"; return; }
    const m = (await r.json()).data[0]; model = m.id; vision = m.modalities.input.includes("image");
    $("modelinfo").textContent = `${m.id} · ${m.max_model_len.toLocaleString()} ctx${vision ? " · vision" : ""}`;
    $("attach").style.display = vision ? "" : "none";
    $("hint").textContent = vision ? "Paste or drop images to attach them." : "This server was started without the vision tower.";
  } catch { $("modelinfo").textContent = "server unreachable"; }
}
loadModels();

// ---------- markdown (small, safe: escapes first)
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const out = []; const parts = src.split(/(```[\s\S]*?(?:```|$))/g);
  for (const part of parts) {
    if (part.startsWith("```")) {
      const m = part.match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
      out.push(`<pre><code>${esc(m ? m[2] : part.slice(3))}</code></pre>`); continue;
    }
    const lines = esc(part).split("\n"); let para = [], list = null, table = null;
    const flush = () => {
      if (para.length) { out.push(`<p>${inline(para.join("<br>"))}</p>`); para = []; }
      if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.t}>`); list = null; }
      if (table) { out.push("<table>" + table.map((r, i) => "<tr>" + r.map(c => i ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>"); table = null; }
    };
    for (const l of lines) {
      let m;
      if (!l.trim()) { flush(); continue; }
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); out.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`); continue; }
      if ((m = l.match(/^\s*[-*+]\s+(.*)/))) { if (para.length || (list && list.t !== "ul")) flush(); list = list || { t: "ul", items: [] }; list.items.push(m[1]); continue; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (para.length || (list && list.t !== "ol")) flush(); list = list || { t: "ol", items: [] }; list.items.push(m[1]); continue; }
      if (/^\s*\|.*\|\s*$/.test(l)) { if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue; if (!table) flush(); table = table || []; table.push(l.trim().slice(1, -1).split("|").map(c => c.trim())); continue; }
      if ((m = l.match(/^&gt;\s?(.*)/))) { flush(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
      if (list) flush();
      para.push(l);
    }
    flush();
  }
  return out.join("");
}

// ---------- conversations
function saveConvs() { store.set("convs", convs.map(c => ({ ...c, messages: c.messages.map(m => ({ ...m })) }))); }
function newConv() { cur = { id: Date.now().toString(36), title: "New chat", messages: [] }; convs.unshift(cur); saveConvs(); render(); renderList(); }
function renderList() {
  const el = $("convs"); el.innerHTML = "";
  for (const c of convs) {
    const d = document.createElement("div"); d.className = "conv" + (c === cur ? " on" : "");
    d.innerHTML = `<span>${esc(c.title)}</span><button class="x" title="Delete">✕</button>`;
    d.onclick = () => { if (busy) return; cur = c; render(); renderList(); $("side").classList.remove("open"); };
    d.querySelector(".x").onclick = (e) => { e.stopPropagation(); if (busy && c === cur) return; convs = convs.filter(x => x !== c); if (cur === c) cur = convs[0] || null; if (!cur) newConv(); saveConvs(); render(); renderList(); };
    el.appendChild(d);
  }
}
function msgEl(m, i) {
  const d = document.createElement("div"); d.className = "msg " + m.role;
  const who = m.role === "user" ? "You" : "Inkling";
  d.innerHTML = `<div class="who">${who}</div>`;
  if (m.images && m.images.length) { const g = document.createElement("div"); g.className = "imgs"; for (const u of m.images) { const im = document.createElement("img"); im.src = u; g.appendChild(im); } d.appendChild(g); }
  if (m.role === "assistant" && m.reasoning && $("showthink").value !== "hide") {
    // Scroll position and open state live in `thinkState` so they survive re-renders; while
    // streaming, updateLast() moves the live <details> into the rebuilt message instead.
    const st = thinkState.get(m) || { follow: true, top: 0, open: null };
    thinkState.set(m, st);
    const t = document.createElement("details"); t.className = "think";
    t.open = st.open ?? ($("showthink").value === "open" || (m.streaming && !m.content));
    t.innerHTML = `<summary></summary><div class="tbody"></div>`;
    const th = { t, tb: t.querySelector(".tbody"), st };
    fillThink(th, m);
    // only a click is the user's choice (setting `open` in code also fires "toggle")
    t.querySelector("summary").addEventListener("click", () => { st.open = !t.open; });
    t.addEventListener("toggle", () => { if (t.open) applyThinkScroll(th); });
    th.tb.addEventListener("scroll", () => {
      // ignore the scrolls we set ourselves; any other position is the user's
      if (th.tb.scrollTop === th.setTo) return;
      st.follow = th.tb.scrollHeight - th.tb.scrollTop - th.tb.clientHeight < 8;
      st.top = th.tb.scrollTop;
    });
    d._think = th;
    d.appendChild(t);
  }
  if (m.tool_calls) for (const tc of m.tool_calls) { const t = document.createElement("div"); t.className = "tool"; t.textContent = `→ ${tc.function.name}(${tc.function.arguments})`; d.appendChild(t); }
  const b = document.createElement("div"); b.className = "body" + (m.streaming ? " cursor" : "");
  if (m.role === "user") b.textContent = m.content; else b.innerHTML = md(m.content || "");
  if (m.content || m.role === "user" || m.streaming) d.appendChild(b);
  if (m.error) { const e = document.createElement("div"); e.className = "err"; e.textContent = m.error; d.appendChild(e); }
  if (m.role === "assistant" && !m.streaming) {
    const s = document.createElement("div"); s.className = "stats";
    if (m.stats) s.innerHTML = `<span>${m.stats}</span>`;
    const cp = document.createElement("button"); cp.textContent = "Copy"; cp.onclick = () => navigator.clipboard.writeText(m.content || ""); s.appendChild(cp);
    if (i === cur.messages.length - 1) { const rg = document.createElement("button"); rg.textContent = "Regenerate"; rg.onclick = regenerate; s.appendChild(rg); }
    d.appendChild(s);
  }
  if (m.role === "user" && i === cur.messages.length - 2 && !busy) {
    const s = document.createElement("div"); s.className = "stats"; s.style.justifyContent = "flex-end";
    const ed = document.createElement("button"); ed.textContent = "Edit"; ed.onclick = () => { $("input").value = m.content; pending = (m.images || []).slice(); cur.messages.splice(i); saveConvs(); render(); drawPending(); $("input").focus(); };
    s.appendChild(ed); d.appendChild(s);
  }
  return d;
}
function render() {
  const el = $("msgs"); el.innerHTML = "";
  $("title").textContent = cur ? cur.title : "New chat";
  if (!cur || !cur.messages.length) {
    el.innerHTML = `<div class="empty"><h2>Inkling-2-Mini</h2><div>A looped mixture-of-experts model running locally on your GPU through wgpu.</div></div>`;
    return;
  }
  cur.messages.forEach((m, i) => { const n = msgEl(m, i); el.appendChild(n); if (n._think) applyThinkScroll(n._think); });
  const log = $("log"); log.scrollTop = log.scrollHeight;
}
function updateLast() {
  const el = $("msgs"); const i = cur.messages.length - 1; const m = cur.messages[i];
  const log = $("log"); const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const old = el.lastChild && el.lastChild.classList.contains("msg") ? el.lastChild : null;
  let n = msgEl(m, i);
  if (old && old._think && n._think) {
    // keep the live thinking box in the document (detaching an element resets its scroll
    // position): update it in place and swap the message's other children around it
    const keep = old._think.t;
    fillThink(old._think, m);
    const kids = [...n.childNodes];
    const at = kids.indexOf(n._think.t);
    for (const c of [...old.childNodes]) if (c !== keep) old.removeChild(c);
    for (const c of kids.slice(0, at)) old.insertBefore(c, keep);
    for (const c of kids.slice(at + 1)) old.appendChild(c);
    old.className = n.className;
    n = old;
  } else if (old) el.replaceChild(n, old); else el.appendChild(n);
  if (n._think) applyThinkScroll(n._think);
  if (atBottom) log.scrollTop = log.scrollHeight;
}
// Scroll state of each message's thinking box, kept across re-renders (not persisted).
const thinkState = new WeakMap();
function fillThink(th, m) {
  const s = m.streaming && !m.content ? "Thinking…" : `Thought for ${m.reasoning.length.toLocaleString()} characters`;
  const sum = th.t.querySelector("summary");
  if (sum.textContent !== s) sum.textContent = s;
  // append only the new text: replacing the node would reset the scroll position
  if (!th.node) { th.node = document.createTextNode(""); th.tb.appendChild(th.node); }
  const have = th.node.data;
  if (m.reasoning.startsWith(have)) { if (m.reasoning.length > have.length) th.node.appendData(m.reasoning.slice(have.length)); }
  else th.node.data = m.reasoning;
}
// Follow the newest text, or hold the position the user scrolled to.
function applyThinkScroll(th) {
  const { tb, st } = th;
  // the user moved it since we last set it, possibly before its scroll event was dispatched
  if (th.setTo != null && Math.abs(tb.scrollTop - th.setTo) > 1) {
    st.follow = tb.scrollHeight - tb.scrollTop - tb.clientHeight < 8;
    st.top = tb.scrollTop;
  }
  const want = st.follow ? tb.scrollHeight : st.top;
  if (Math.abs(tb.scrollTop - want) < 1 && !st.follow) return;
  tb.scrollTop = want;
  th.setTo = tb.scrollTop;
}

// ---------- images
function addFiles(files) {
  if (!vision) return;
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    const r = new FileReader(); r.onload = () => { pending.push(r.result); drawPending(); }; r.readAsDataURL(f);
  }
}
function drawPending() {
  const el = $("pending"); el.innerHTML = "";
  pending.forEach((u, i) => { const d = document.createElement("div"); d.className = "p"; d.innerHTML = `<img src="${u}"><button title="Remove">✕</button>`; d.querySelector("button").onclick = () => { pending.splice(i, 1); drawPending(); }; el.appendChild(d); });
}
$("attach").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
$("input").addEventListener("paste", (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); addFiles(fs); } });
let dragN = 0;
window.addEventListener("dragenter", (e) => { if (vision && e.dataTransfer?.types?.includes("Files")) { dragN++; $("drop").style.display = "flex"; } });
window.addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; $("drop").style.display = "none"; } });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); dragN = 0; $("drop").style.display = "none"; addFiles(e.dataTransfer.files); });

// ---------- sending
const input = $("input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 240) + "px"; });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("send").onclick = () => busy ? busy.abort() : send();
$("new").onclick = () => { if (!busy) newConv(); };

function apiMessages() {
  const out = [];
  const sys = $("sys").value.trim();
  if (sys) out.push({ role: "system", content: sys });
  for (const m of cur.messages) {
    if (m.error && !m.content) continue;
    if (m.role === "user") {
      if (m.images && m.images.length) out.push({ role: "user", content: [...m.images.map(u => ({ type: "image_url", image_url: { url: u } })), { type: "text", text: m.content }] });
      else out.push({ role: "user", content: m.content });
    } else {
      const a = { role: "assistant", content: m.content || "" };
      if (m.reasoning) a.reasoning_content = m.reasoning;
      if (m.tool_calls) a.tool_calls = m.tool_calls;
      out.push(a);
      if (m.tool_calls) for (const tc of m.tool_calls) out.push({ role: "tool", tool_call_id: tc.id, content: "(tool results are not available in this UI)" });
    }
  }
  return out;
}

async function send() {
  const text = input.value.trim();
  if (busy || (!text && !pending.length)) return;
  if (!cur) newConv();
  cur.messages.push({ role: "user", content: text, images: pending.slice() });
  if (cur.messages.length === 1) { cur.title = (text || "Image").slice(0, 60); renderList(); }
  input.value = ""; input.style.height = "auto"; pending = []; drawPending();
  await complete();
}
async function regenerate() {
  if (busy) return;
  if (cur.messages.length && cur.messages[cur.messages.length - 1].role === "assistant") cur.messages.pop();
  await complete();
}
async function complete() {
  const msg = { role: "assistant", content: "", reasoning: "", streaming: true };
  const ctl = new AbortController(); busy = ctl; $("send").textContent = "Stop"; $("send").classList.add("danger");
  cur.messages.push(msg); render();
  const body = { model, messages: apiMessages().slice(0, -1), stream: true, stream_options: { include_usage: true },
    temperature: +$("temp").value, top_p: +$("topp").value, max_tokens: +$("maxtok").value, reasoning_effort: $("effort").value };
  try { const t = JSON.parse($("tools").value || "null"); if (Array.isArray(t) && t.length) body.tools = t; } catch { }
  const t0 = performance.now(); let tFirst = null, usage = null, frame = 0;
  try {
    const r = await apiFetch("/v1/chat/completions", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal: ctl.signal });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || r.statusText); }
    const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, k); buf = buf.slice(k + 2);
        for (const line of ev.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim(); if (data === "[DONE]") continue;
          const j = JSON.parse(data);
          if (j.error) throw new Error(j.error.message);
          if (j.usage) usage = j.usage;
          const d = j.choices?.[0]?.delta; if (!d) continue;
          if ((d.content || d.reasoning_content) && tFirst == null) tFirst = performance.now();
          if (d.reasoning_content) msg.reasoning += d.reasoning_content;
          if (d.content) msg.content += d.content;
          if (d.tool_calls) msg.tool_calls = (msg.tool_calls || []).concat(d.tool_calls);
        }
      }
      if (++frame % 2 === 0) updateLast();
    }
  } catch (e) {
    if (e.name !== "AbortError") msg.error = String(e.message || e); else msg.error = msg.content ? "" : "(stopped)";
  }
  msg.streaming = false; busy = null; $("send").textContent = "Send"; $("send").classList.remove("danger");
  const dt = (performance.now() - t0) / 1000;
  if (usage) {
    const gen = usage.completion_tokens, ttft = tFirst ? (tFirst - t0) / 1000 : dt;
    msg.stats = `${gen} tokens · ${(gen / Math.max(dt - ttft, 1e-3)).toFixed(1)} tok/s · first token ${ttft.toFixed(2)} s · prompt ${usage.prompt_tokens} (${usage.prompt_tokens_details?.cached_tokens || 0} cached)`;
  }
  if (!msg.reasoning) delete msg.reasoning;
  saveConvs(); render();
}

if (!convs.length) newConv(); else { cur = convs[0]; render(); renderList(); }
input.focus();
</script>
